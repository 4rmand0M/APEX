[build]
  publish = "."

# Configuración de redirecciones para URLs limpias (sin .html)
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# Manejo de rutas para Single Page Application si fuera necesario, 
# pero aquí como es estático, Netlify servirá el archivo correspondiente.
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# Encabezados de seguridad básicos y Rate Limiting
# Nota: Netlify maneja la protección contra ataques DDoS y Rate Limiting a nivel de red.
# Podemos añadir encabezados para mejorar la seguridad general.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Cache control básico
    Cache-Control = "public, max-age=0, must-revalidate"
